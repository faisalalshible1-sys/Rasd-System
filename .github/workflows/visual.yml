# لقطات بصرية للصفحات ببيانات تجريبية (للتدقيق على التصميم قبل الإصدار). تُشغَّل يدوياً،
# وتُرفع الصور ملفاتِ تشغيل، وتُنشر أيضاً في الفرع visual-shots لتُراجَع دون تنزيل الملفات.
name: visual

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    name: لقطات الواجهة
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: خطوط عربية
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core fonts-dejavu-core > /dev/null
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: اللقطات
        shell: bash
        run: |
          export FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          set +e
          flutter test visual_test --update-goldens > shots.txt 2>&1; code=$?
          cat shots.txt
          mkdir -p visual_test/goldens && cp shots.txt visual_test/goldens/log.txt
          [ $code -ne 0 ] && bash tool/ci_annotate.sh shots.txt "visual"
          exit 0
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: visual-shots
          path: visual_test/goldens
      - name: نشر اللقطات في الفرع visual-shots
        shell: bash
        run: |
          set -e
          src="$(pwd)/visual_test/goldens"
          tmp="$(mktemp -d)"
          cp -r "$src"/. "$tmp"/
          cd "$tmp"
          git init -q -b visual-shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "visual shots for ${GITHUB_SHA::7} [skip ci]"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:visual-shots
