# بناء نسخة آيفون (غير موقّعة) — منفصل لأن أجهزة Mac على GitHub تكون مزدحمة أحياناً.
# يبدأ بعد نجاح الفحص على main، أو يدوياً من Actions مع اختيار نوع الجهاز.
# التوقيع والتوزيع عبر TestFlight يتطلبان حساب Apple Developer.
name: ios

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'نوع جهاز Mac'
        required: false
        default: 'macos-15-intel'
        type: choice
        options: ['macos-15-intel', 'macos-latest', 'macos-14']
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]

env:
  REF: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  ios:
    name: آيفون (غير موقّع)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/prepare_platforms.sh
      - run: flutter pub get
      - name: flutter build ios
        shell: bash
        run: |
          set +e
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} > out.txt 2>&1; code=$?; cat out.txt
          [ $code -ne 0 ] && bash tool/ci_annotate.sh out.txt "build ios"
          exit $code
      - run: cd build/ios/iphoneos && zip -qr Runner-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: build/ios/iphoneos/Runner-unsigned.zip
