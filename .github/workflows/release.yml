# «إصدار جديد» — يُشغَّل يدوياً بقرار مدير المكتب من تبويب Actions ← release ← Run workflow.
# يبني أندرويد وويندوز والويب برقم إصدار جديد، ويرفع الملفات إلى Supabase، وينشر الويب على Netlify،
# ثم يسجّل الإصدار فيظهر للموظفين «يتوفر تحديث» داخل التطبيق.
#
# الأسرار المطلوبة (Settings ← Secrets and variables ← Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY   (موجودان)
#   SUPABASE_SERVICE_KEY              المفتاح السري لـ Supabase (sb_secret_...) — يُستخدم هنا فقط لرفع الملفات
#   ANDROID_SIGNING_PASSWORD          كلمة سر مفتاح توقيع أندرويد
#   NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID   لنشر الويب (اختياريان)
name: release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'ما الجديد في هذا الإصدار؟ (يظهر للموظفين)'
        required: true
        type: string
      mandatory:
        description: 'تحديث إلزامي (لا يعمل التطبيق القديم حتى يُحدَّث)'
        required: false
        default: false
        type: boolean
      version:
        description: 'رقم الإصدار الظاهر (مثل 1.0.0). يُترك فارغاً ليكون 1.0.<رقم التشغيل>'
        required: false
        default: ''
        type: string
      prune_old:
        description: 'حذف كل الإصدارات السابقة (ملفاتها وسجلاتها) بعد نشر هذا الإصدار'
        required: false
        default: false
        type: boolean
      web_only:
        description: 'نشر الويب وحده (بعد تجديد رمز Netlify مثلاً) دون بناء أندرويد وويندوز ودون تسجيل إصدار جديد'
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

env:
  # رقم البناء يزيد دائماً مع كل إصدار، وعليه يعتمد التطبيق في معرفة وجود تحديث؛ رقم الإصدار للعرض فقط
  VERSION: ${{ inputs.version != '' && inputs.version || format('1.0.{0}', github.run_number) }}
  BUILD: ${{ github.run_number }}

jobs:
  checks:
    name: التحقق قبل الإصدار
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: دليل الاستخدام محدّث لهذا الإصدار
        shell: bash
        run: |
          if ! grep -qxF "## الإصدار $VERSION" assets/manual/changelog.md; then
            echo "::error title=دليل الاستخدام::لا يُنشر الإصدار $VERSION قبل إضافة قسم «## الإصدار $VERSION» في assets/manual/changelog.md يشرح ما تغيّر، وتحديث فصول الدليل المعنية."
            exit 1
          fi
      - name: الأسرار المطلوبة
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          ANON: ${{ secrets.SUPABASE_ANON_KEY }}
          SERVICE: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SIGN: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          NOTES: ${{ inputs.notes }}
        shell: bash
        run: |
          missing=""
          [ -z "$URL" ] && missing="$missing SUPABASE_URL"
          [ -z "$ANON" ] && missing="$missing SUPABASE_ANON_KEY"
          [ -z "$SERVICE" ] && missing="$missing SUPABASE_SERVICE_KEY"
          [ -z "$SIGN" ] && missing="$missing ANDROID_SIGNING_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=أسرار ناقصة::أضف في إعدادات المستودع:$missing"; exit 1
          fi
          case "$SERVICE" in sb_publishable_*) echo "::error title=SUPABASE_SERVICE_KEY::هذا هو المفتاح العام. ضع المفتاح السري sb_secret_..."; exit 1;; esac
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=رقم الإصدار::«$VERSION» غير صالح؛ الصيغة المطلوبة مثل 1.0.0"; exit 1
          fi
          echo "::notice title=الإصدار $VERSION::$NOTES"

  android:
    name: أندرويد
    needs: checks
    if: ${{ !inputs.web_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/prepare_platforms.sh
      - run: flutter pub get
      - name: flutter build apk
        shell: bash
        run: |
          set +e
          flutter build apk --release --split-per-abi --build-name=$VERSION --build-number=$BUILD \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=APP_VERSION=$VERSION --dart-define=APP_BUILD=$BUILD > out.txt 2>&1; code=$?; cat out.txt
          [ $code -ne 0 ] && bash tool/ci_annotate.sh out.txt "build apk"
          exit $code
      - name: التوقيع بمفتاح المؤسسة
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          bash tool/sign_apk.sh build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dc-app-arm64.apk
          bash tool/sign_apk.sh build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dc-app-arm32.apk
          ls -la dc-app-*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dc-app-*.apk

  windows:
    name: ويندوز
    needs: checks
    if: ${{ !inputs.web_only }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/prepare_platforms.sh
        shell: bash
      - run: flutter pub get
      - name: flutter build windows
        shell: bash
        run: |
          set +e
          flutter build windows --release --build-name=$VERSION --build-number=$BUILD \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=APP_VERSION=$VERSION --dart-define=APP_BUILD=$BUILD > out.txt 2>&1; code=$?; cat out.txt
          [ $code -ne 0 ] && bash tool/ci_annotate.sh out.txt "build windows"
          exit $code
      - name: برنامج التثبيت
        shell: bash
        run: |
          set +e
          bash tool/build_windows_installer.sh "$VERSION" > out.txt 2>&1; code=$?; cat out.txt
          [ $code -ne 0 ] && bash tool/ci_annotate.sh out.txt "installer"
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/dc-app-setup.exe

  web:
    name: الويب
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/prepare_platforms.sh
      - run: flutter pub get
      - run: >-
          flutter build web --release --build-name=$VERSION --build-number=$BUILD
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=APP_VERSION=$VERSION --dart-define=APP_BUILD=$BUILD
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: build/web
      - name: النشر على Netlify
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          WEB_ONLY: ${{ inputs.web_only }}
        shell: bash
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::notice title=الويب::لم يُنشر الويب لأن سرّي NETLIFY_AUTH_TOKEN و NETLIFY_SITE_ID غير موجودين. النسخة متاحة في ملفات التشغيل (release-web)."
            exit 0
          fi
          set +e
          npx --yes netlify-cli deploy --prod --dir=build/web --site="$NETLIFY_SITE_ID" --message="v$VERSION" --json > deploy.json 2> deploy.err; code=$?
          if [ $code -ne 0 ]; then
            # تعذّر النشر على Netlify (رمز منتهٍ أو مرفوض مثلاً): لا يوقف إصدار أندرويد وويندوز، ويبقى الويب على نسخته السابقة
            cat deploy.err
            reason=$(grep -m1 -E "Error|Forbidden|Unauthorized" deploy.err | sed 's/^[^A-Za-z]*//' | cut -c1-160)
            # تشخيص دون كشف أي سرّ (السجل عام): هل الرمز صالح؟ هل يصل إلى الموقع؟ هل الحساب أو الموقع موقوف؟
            diag=$(python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error
          tok, site = os.environ["NETLIFY_AUTH_TOKEN"], os.environ["NETLIFY_SITE_ID"]
          def get(path):
              req = urllib.request.Request("https://api.netlify.com/api/v1/" + path, headers={"Authorization": "Bearer " + tok})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read() or b"null")
              except urllib.error.HTTPError as e:
                  return e.code, None
          flag = re.compile(r"disabl|pause|suspend|lock|limit|credit|exceed|block", re.I)
          def flags(o):
              return {k: v for k, v in (o or {}).items() if flag.search(k) and isinstance(v, (bool, int, str)) and len(str(v)) < 60}
          out = []
          c, _ = get("user"); out.append(f"الرمز HTTP {c}")
          c, s = get("sites/" + site)
          out.append(f"الموقع HTTP {c}")
          if s:
              out.append(f"{s.get('name')} · الحالة {s.get('state')} · الخطة {s.get('account_type')} {flags(s)}")
          c, accts = get("accounts")
          for a in accts or []:
              out.append(f"حساب {a.get('slug')} · {a.get('type_name')} {flags(a)}")
          print(" | ".join(out)[:900])
          PY
            )
            echo "::warning title=تشخيص Netlify::$diag"
            echo "::warning title=الويب لم يُنشر::تعذّر النشر على Netlify ($reason). جدّد رمز NETLIFY_AUTH_TOKEN في أسرار GitHub ثم أعد نشر الويب؛ نسخة الويب متاحة في ملفات التشغيل (release-web)."
            # عند نشر الويب وحده يُعدّ الفشل فشلاً حتى يظهر بوضوح
            [ "$WEB_ONLY" = "true" ] && exit 1
            exit 0
          fi
          url=$(python3 -c "import json; d=json.load(open('deploy.json')); print(d.get('url') or d.get('deploy_url') or '')")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=الويب::$url"

  manual:
    name: دليل الاستخدام PDF
    needs: checks
    if: ${{ !inputs.web_only }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: الخطوط والأدوات
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core fonts-freefont-ttf >/dev/null
          pip install --quiet pypdf
      - name: بناء نسخة PDF
        run: python3 tool/build_manual.py --version "$VERSION" --out "manual-$VERSION.pdf"
      - name: رفعها إلى المخزن الخاص للمنظومة
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        shell: bash
        run: |
          auth=(-H "apikey: $SUPABASE_SERVICE_KEY")
          case "$SUPABASE_SERVICE_KEY" in eyJ*) auth+=(-H "Authorization: Bearer $SUPABASE_SERVICE_KEY");; esac
          for name in "manual-$VERSION.pdf" "manual-latest.pdf"; do
            code=$(curl -s -o out.txt -w '%{http_code}' -X POST "${SUPABASE_URL%/}/storage/v1/object/docs/manual/$name" \
              "${auth[@]}" -H "Content-Type: application/pdf" -H "x-upsert: true" --data-binary @"manual-$VERSION.pdf")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::warning title=دليل الاستخدام::تعذّر رفع $name (HTTP $code): $(head -c 300 out.txt)"; exit 0
            fi
          done
          echo "::notice title=دليل الاستخدام::نُشرت نسخة PDF للإصدار $VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: manual-pdf
          path: manual-*.pdf

  publish:
    name: نشر الإصدار
    needs: [android, windows, web]
    if: ${{ !inputs.web_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist
      - name: رفع الملفات وتسجيل الإصدار
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NOTES: ${{ inputs.notes }}
          MANDATORY: ${{ inputs.mandatory }}
          PRUNE_OLD: ${{ inputs.prune_old }}
          APK: dist/dc-app-arm64.apk
          APK_ARM32: dist/dc-app-arm32.apk
          WINDOWS_SETUP: dist/dc-app-setup.exe
          WEB_URL: ${{ needs.web.outputs.url }}
        run: python3 tool/publish_release.py
