# البناء الكامل لكل المنصات. يبدأ تلقائياً بعد نجاح الفحص (check) على الفرع main، أو يدوياً من تبويب Actions.
# لكي يعمل التطبيق المبني، أضف في Settings ← Secrets and variables ← Actions:
#   SUPABASE_URL       عنوان مشروع Supabase
#   SUPABASE_ANON_KEY  المفتاح العام (anon أو publishable) — وليس مفتاح service_role
name: build

on:
  workflow_dispatch:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]

env:
  REF: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  android:
    name: أندرويد (APK)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/prepare_platforms.sh
      - run: flutter pub get
      - name: flutter build apk
        shell: bash
        run: |
          set +e
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} > out.txt 2>&1; code=$?; cat out.txt
          [ $code -ne 0 ] && bash tool/ci_annotate.sh out.txt "build apk"
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  web:
    name: الويب
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/prepare_platforms.sh
      - run: flutter pub get
      - run: >-
          flutter build web --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web

  windows:
    name: ويندوز
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/prepare_platforms.sh
        shell: bash
      - run: flutter pub get
      - name: flutter build windows
        shell: bash
        run: |
          set +e
          flutter build windows --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} > out.txt 2>&1; code=$?; cat out.txt
          [ $code -ne 0 ] && bash tool/ci_annotate.sh out.txt "build windows"
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/x64/runner/Release

  ios:
    name: آيفون (غير موقّع)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/prepare_platforms.sh
      - run: flutter pub get
      - name: flutter build ios
        shell: bash
        run: |
          set +e
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} > out.txt 2>&1; code=$?; cat out.txt
          [ $code -ne 0 ] && bash tool/ci_annotate.sh out.txt "build ios"
          exit $code
      - run: cd build/ios/iphoneos && zip -qr Runner-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: build/ios/iphoneos/Runner-unsigned.zip
