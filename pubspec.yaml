name: dc_app
description: منظومة متابعة نماذج الدورة المستندية للمشاريع — مكتب الشؤون الهندسية.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  google_fonts: ^6.2.1
  excel: ^4.0.6
  file_saver: ^0.2.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

# أيقونة التطبيق من ختم المؤسسة لكل المنصات (تُولَّد في tool/prepare_platforms.sh)
flutter_launcher_icons:
  image_path: "assets/brand/icon.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/brand/icon.png"
    background_color: "#FFFFFF"
    theme_color: "#8A6A1E"
  windows:
    generate: true
    image_path: "assets/brand/icon.png"
    icon_size: 256
