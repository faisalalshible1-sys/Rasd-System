name: dc_app
description: منظومة متابعة نماذج الدورة المستندية للمشاريع — مكتب الشؤون الهندسية.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  google_fonts: ^6.2.1
  excel: ^4.0.6
  file_saver: ^0.2.14
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.2
  file_picker: ^13.0.0
  image: ^4.0.0
  # الطباعة والتصدير: PDF بخطوط عربية مضمّنة، وحزم Word وZIP، وفتح الملف للطباعة في المتصفح
  pdf: ^3.11.0
  archive: ^3.6.1
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/manual/
    - assets/fonts/
  # خطوط صفحة الطباعة (المعاينة داخل المنظومة تطابق ملف PDF)
  fonts:
    - family: PrintNaskh
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
    - family: PrintKufi
      fonts:
        - asset: assets/fonts/NotoKufiArabic-Regular.ttf
        - asset: assets/fonts/NotoKufiArabic-Bold.ttf
          weight: 700
    - family: PrintSans
      fonts:
        - asset: assets/fonts/ArLatSans-Regular.ttf
        - asset: assets/fonts/ArLatSans-Bold.ttf
          weight: 700

# أيقونة التطبيق من ختم المؤسسة لكل المنصات (تُولَّد في tool/prepare_platforms.sh)
flutter_launcher_icons:
  image_path: "assets/brand/icon.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/brand/icon.png"
    background_color: "#FFFFFF"
    theme_color: "#8A6A1E"
  windows:
    generate: true
    image_path: "assets/brand/icon.png"
    icon_size: 256
